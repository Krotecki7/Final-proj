{% load static%}
<header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'diary:home' %}">
                <img src="{% static 'logo/diary-svgrepo-com (1).svg' %}" alt="Logo" width="30" height="24"
                     class="d-inline-block align-text-top">
                My Diary
            </a>
            {% if user.is_authenticated %}
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'diary:note_list' %}">Мой дневник</a>
                    </li>
                    <li>
                        <form method="get" action="{% url 'diary:search_result' %}" >
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <input class="form-control me-2" name="q" type="text" aria-label="Поиск" placeholder="Поиск">
                            <button class="btn btn-outline-success " type="submit">Начать</button>
                                </div>
                        </form>
                    </li>
                </ul>

                <form method="post" action="{% url 'users:logout' %}" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="p-2 btn dark">Выйти
                    </button>
                </form>
            </div>
            {% else %}
            <div>
                <a class="nav-link" href="{% url 'users:login' %}">Войти</a>
                <a class="nav-link" href="{% url 'users:register' %}">Регистрация</a>

            </div>
            {% endif %}
        </div>
    </nav>
</header>
