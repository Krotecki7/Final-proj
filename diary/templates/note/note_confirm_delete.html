{% extends 'base.html' %}
{% block content %}
    <div class="container mt-5">
        <h1 class="mb-4">Удалить запись?</h1>
        <p>Вы уверены, что хотите удалить "{{ note.name }}"?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'diary:note_list' %}" class="btn btn-light">Отмена</a>
        </form>
    </div>
{% endblock %}
