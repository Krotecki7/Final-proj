{% extends 'base.html' %}

{% block content %}
<div class="container pt-3 pb-2 mb-3">
    <div>
        <h1 class="text-center">Результаты поиска</h1>
    </div>
</div>
<ul>
  {% for note in object_list %}
  <div class="card" style="margin-bottom: 10px;">
  <div class="card-body" style="padding: 25px;">
    <h5 class="card-title text-center">{{ note.name }}</h5>
    <p class="card-text">{{ note.text }}</p>
    <a href="{% url 'diary:note_detail' note.pk %}" class="link-body-emphasis link-offset-2 link-underline-opacity-25 link-underline-opacity-75-hover">Просмотр</a>
  </div>
</div>
  {% endfor %}
</ul>
{% endblock %}
