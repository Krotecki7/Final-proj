{% extends 'base.html' %}
{% load my_tags %}
{% block content %}
{% include 'title.html' %}

<div class="row text-center">
    <div class="mx-auto">
        <p class="d-inline-flex gap-1">
            <a class="btn btn-outline-dark" href="{% url 'diary:note_create' %}" role="button">Создать запись</a>
        </p>
    </div>
</div>
<div>
    <div class="container mt-5 justify-content-center">
        {% for note in notes %}
        {% if note.owner == request.user %}
        <div class="accordion accordion-flush" id="accordionFlushExample">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                            data-bs-target="#flush-collapseOne" aria-expanded="false" aria-controls="flush-collapseOne">
                        {{ note.name }}
                    </button>
                </h2>
                <div id="flush-collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample">
                    <div class="accordion-body ">
                        <a href="{% url 'diary:note_detail' note.pk %}"
                           class="link-body-emphasis link-offset-2 link-underline-opacity-25 link-underline-opacity-75-hover">Читать</a>
                    </div>
                </div>
            </div>
        </div>
        {% endif %}
        {% endfor %}
    </div>
</div>

<script>
    const headers = document.querySelectorAll('.accordion-header');

    headers.forEach(header => {
      header.addEventListener('click', () => {
        headers.forEach(h => {
          if (h !== header) {
            h.nextElementSibling.style.display = 'none'; // закрываем все, кроме текущего
          }
        });
        const content = header.nextElementSibling;
        if (content.style.display === 'block') {
          content.style.display = 'none'; // закрываем, если открыт
        } else {
          content.style.display = 'block'; // открываем текущий
        }
      });
    });
</script>

{% endblock %}
